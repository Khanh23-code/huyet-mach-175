name: Continuous Integration (CI)

on:
  pull_request:
    branches: [ "dev", "main" ]
  push:
    branches: [ "dev", "main" ]

jobs:
  # JOB 1: KIỂM TRA BIÊN DỊCH BACKEND .NET
  backend-check:
    name: Build & Check Backend (.NET)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Restore Dependencies
        run: dotnet restore

      - name: Build Backend Solution
        run: dotnet build --no-restore --configuration Release

  # JOB 2: KIỂM TRA BIÊN DỊCH FRONTEND REACT
  frontend-check:
    name: Build & Check Frontend (React Vite)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./client

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Build Frontend Client
        run: npm run build